name: Playwright Tests

on:
  workflow_call:

permissions:
  contents: "read"

jobs:
  Playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Generate ID Token
        run: |
          set -u
          token=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=trace-api" | jq -r '.value')
          issuer=$(echo $token | cut -d'.' -f2 | base64 --decode | jq -r '.iss')
          sub=$(echo $token | cut -d'.' -f2 | base64 --decode | jq -r '.sub')
          echo "IDP_TOKEN=$token" >> $GITHUB_ENV
          echo "TRACE_ADMIN_ISSUER=$issuer" >> $GITHUB_ENV
          echo "TRACE_ADMIN_SUB=$sub" >> $GITHUB_ENV
      - run: bun playwright install --with-deps
      - run: bun e2e
        working-directory: packages/trace-playwright
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
